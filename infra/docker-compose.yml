version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wattwise-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wattwise}
      POSTGRES_USER: ${POSTGRES_USER:-ww}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in environment}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../scripts/seed.sql:/docker-entrypoint-initdb.d/001_seed.sql:ro
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: wattwise-influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USER:-ww}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:?INFLUXDB_PASSWORD must be set in environment}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-wattwise}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-sensors}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN:?INFLUXDB_ADMIN_TOKEN must be set in environment}
    ports:
      - "8086:8086"
    volumes:
      - influxdata:/var/lib/influxdb2
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: wattwise-mqtt
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: wattwise-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: wattwise-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    restart: unless-stopped

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: wattwise-api
    environment:
      ENV: ${ENV:-production}
      PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-ww}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-wattwise}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_ADMIN_TOKEN:?INFLUXDB_ADMIN_TOKEN must be set}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-wattwise}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-sensors}
      KAFKA_BROKERS: kafka:29092
      MQTT_BROKER: tcp://mqtt:1883
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL must be set}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
      - kafka
      - influxdb
    restart: unless-stopped

  ml:
    build:
      context: ../apps/ml
      dockerfile: Dockerfile
    container_name: wattwise-ml
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
  influxdata:

