name: ML Services CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r apps/ml/requirements.txt

      - name: Lint and Syntax Check
        run: |
          flake8 apps/ml --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run ML Validation & Backtesting Tests (pytest)
        run: |
          PYTHONPATH=apps/ml python -m pytest apps/ml/tests -v
