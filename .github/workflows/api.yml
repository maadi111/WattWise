name: API Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: apps/api/go.sum

      - name: Verify dependencies
        run: |
          cd apps/api
          go mod verify

      - name: Build Go API
        run: |
          cd apps/api
          go build -v ./...

      - name: Go Vet
        run: |
          cd apps/api
          go vet ./...

      - name: Run Go Unit & Integration Tests
        run: |
          cd apps/api
          go test -v -race ./...
