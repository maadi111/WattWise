name: API Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wattwise_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: apps/api/go.sum

      - name: Verify dependencies
        run: |
          cd apps/api
          go mod verify

      - name: Enforce gofmt
        run: |
          cd apps/api
          DIFF=$(gofmt -l .)
          if [ -n "$DIFF" ]; then
            echo "gofmt code formatting violations detected in:"
            echo "$DIFF"
            exit 1
          fi

      - name: Build Go API
        run: |
          cd apps/api
          go build -v ./...

      - name: Go Vet
        run: |
          cd apps/api
          go vet ./...

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd apps/api
          govulncheck ./... || true

      - name: Run Go Unit & Integration Tests with Coverage
        env:
          ENV: test
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/wattwise_test?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci_test_jwt_secret_key_minimum_32_bytes_long!
          ADMIN_EMAIL: admin@wattwise.pk
          ADMIN_PASSWORD: TestAdminPassword123!#
        run: |
          cd apps/api
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

  chaos-and-edge-tests:
    name: Production Chaos & Edge Bench Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Hardware Test Bench Validation (home_test_bench.md)
        run: python apps/edge/wattbrain/test_bench.py

      - name: Run Production Chaos Scenarios (scenarios 1-5)
        run: python infra/chaos/test_chaos.py

  terraform-validate:
    name: Validate Terraform Infrastructure (M13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Format & Validate
        run: |
          cd infra/terraform
          terraform fmt -check
          terraform init -backend=false
          terraform validate

  docker-build:
    name: Build Container Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          push: false

      - name: Build ML Docker Image
        uses: docker/build-push-action@v5
        with:
          context: apps/ml
          push: false

  security-and-secrets-scan:
    name: Secrets & Security Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks Secret Scanner with Custom Policy
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
        continue-on-error: true
